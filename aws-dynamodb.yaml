AWSTemplateFormatVersion: '2010-09-09'
Description: Tabla persistente para los visitantes de MeteRSit
Resources:
  VisitantesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: metersit-visitantes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
Outputs:
  TableName:
    Value: !Ref VisitantesTable
